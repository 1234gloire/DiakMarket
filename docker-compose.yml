services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: diakmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diakmarket
      POSTGRES_PASSWORD: diakmarket
      POSTGRES_DB: diakmarket
    ports:
      - "5432:5432"
    volumes:
      - diakmarket_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diakmarket -d diakmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: diakmarket-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - diakmarket_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  diakmarket_postgres_data:
  diakmarket_redis_data:
